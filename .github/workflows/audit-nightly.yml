# Fellgorithm — NIGHTLY AUDIT: seals the UK day at 23:50 UK time and emails it (one comment on the "Daily audit" issue — Subscribe to it).
name: Nightly audit

on:
  schedule:
    - cron: '50 22 * * *'        # 23:50 UK summer time (22:50 in winter — still the same UK date)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: buses
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seal the day
        run: node bus-build/audit.mjs
      - name: Commit
        run: |
          git config user.name  "fellgorithm-bot"
          git config user.email "fellgorithm-bot@users.noreply.github.com"
          git add audit
          git commit -m "Audit $(TZ=Europe/London date +%F)" || echo "nothing new to commit"
          git pull --rebase --quiet || true
          git push || echo "push failed — will retry tomorrow"
      - name: Email (issue comment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --limit 100 --json number,title -q '[.[] | select(.title=="Daily audit")][0].number // empty')   # exact title, no search index
          if [ -z "$n" ]; then url=$(gh issue create --title "Daily audit" --body "One comment a night: the sealed record of the day. Click Subscribe to get it by email."); n=${url##*/}; fi   # number taken from the new issue's link (search can lag)
          if [ -f audit-email.md ]; then gh issue comment "$n" --body-file audit-email.md; else echo "no audit-email.md written"; fi
